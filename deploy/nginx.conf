# Dedicated private preview. Does not modify the host's public nginx configuration.
daemon off;
worker_processes 1;
pid run/nginx.pid;
error_log stderr warn;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    keepalive_timeout 30;
    server_tokens off;
    gzip_static on;
    gzip_vary on;
    map $uri $asset_cache {
        default "no-cache";
        ~^/assets/ "public, max-age=31536000, immutable";
    }

    client_body_temp_path run/client-body;
    proxy_temp_path run/proxy;
    fastcgi_temp_path run/fastcgi;
    uwsgi_temp_path run/uwsgi;
    scgi_temp_path run/scgi;

    server {
        listen 127.0.0.1:4173;
        server_name localhost;
        root /home/ubuntu/Repos/NekoBeads/public;
        index index.html;
        autoindex off;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control $asset_cache;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;

        location = / {
            limit_except GET {
                deny all;
            }
            try_files /index.html =404;
        }
        location ~ ^/(?:index\.html|robots\.txt|sitemap\.xml|third-party-notices\.txt)$ {
            limit_except GET {
                deny all;
            }
            try_files $uri =404;
        }
        location ~ ^/assets/[A-Za-z0-9_-]+\.(?:js|css|svg)$ {
            limit_except GET {
                deny all;
            }
            try_files $uri =404;
        }
        # Keep pre-TypeScript pages already open in a browser functional during
        # this migration. These files are not replaced by future Vite releases.
        location ~ ^/(?:styles\.css|(?:app|beads|mard|quantize|png|worker|chart|export|export-worker|stylize)\.js)$ {
            limit_except GET {
                deny all;
            }
            try_files $uri =404;
        }
        location / {
            return 404;
        }
    }
}
