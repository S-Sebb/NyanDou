# NyanDou public bootstrap. Only dou.love765.me is added.
server {
    listen 80;
    server_name dou.love765.me;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/nyandou-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://dou.love765.me$request_uri;
    }
}
